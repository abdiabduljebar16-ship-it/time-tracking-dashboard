<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <div class="container">
      <div class="profileAndNav">
        <div class="profile">
          <div class="jeremyImage">
            <img src="images/image-jeremy.png" alt="Jeremy photo as profile" />
          </div>
          <div>
            <p class="report">Report for</p>
            <p id="name">Jeremy Robson</p>
          </div>
        </div>
        <div class="nav"><a>Daily</a> <a>Weekly</a> <a>Monthly</a></div>
      </div>
      <article class="work">
        <div class="icon workIcon">
          <img src="images/icon-work.svg" alt="email icon" />
        </div>
        <div class="displayContainer">
          <div class="titleContainer">
            <p class="title">Work</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">32hrs</p>
            <p class="updatedParagraph">Last Week - 36hrs</p>
          </div>
        </div>
      </article>
      <article class="play">
        <div class="icon playIcon">
          <img
            src="images/icon-play.svg"
            alt="a tool palayed with playstation"
          />
        </div>
        <div class="displayContainer">
          <div class="titleContainer">
            <p class="title">Play</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">10hrs</p>
            <p class="updatedParagraph">Last Week - 8hrs</p>
          </div>
        </div>
      </article>
      <article class="study">
        <div class="icon studyIcon">
          <img src="images/icon-study.svg" alt="study icon" />
        </div>
        <div class="displayContainer">
          <div class="titleContainer">
            <p class="title">Study</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">4hrs</p>
            <p class="updatedParagraph">Last Week - 7hrs</p>
          </div>
        </div>
      </article>
      <article class="exercise">
        <div class="icon exerciseIcon">
          <img
            src="images/icon-exercise.svg"
            alt="person icon with horizontal"
          />
        </div>
        <display class="displayContainer">
          <div class="titleContainer">
            <p class="title">Exercise</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">4hrs</p>
            <p class="updatedParagraph">Last Week - 5hrs</p>
          </div>
        </display>
      </article>
      <article class="social">
        <div class="icon socialIcon">
          <img src="images/icon-social.svg" alt="message icon" />
        </div>
        <div class="displayContainer">
          <div class="titleContainer">
            <p class="title">Social</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">5hrs</p>
            <p class="updatedParagraph">Last Week - 10hrs</p>
          </div>
        </div>
      </article>
      <article class="selfcare">
        <div class="icon selfCareIcon">
          <img
            src="images/icon-self-care.svg"
            alt="heart icon with plus sign inside"
          />
        </div>
        <div class="displayContainer">
          <div class="titleContainer">
            <p class="title">Self Care</p>
            <img src="images/icon-ellipsis.svg" alt="3 dot" />
          </div>
          <div class="timeContainer">
            <p class="timeParagraph">2hrs</p>
            <p class="updatedParagraph">Last Week - 2hrs</p>
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
